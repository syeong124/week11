
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #eaf0f8;
        }

        .calculator {
            width: 260px;
            padding: 20px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 10px gray;
        }

        h2 {
            text-align: center;
        }

        #display {
            width: 100%;
            height: 50px;
            margin-bottom: 15px;
            box-sizing: border-box;
            text-align: right;
            font-size: 25px;
            border: none;
            background-color: #f1f3f5;
            border-radius: 8px;
            padding: 10px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            height: 50px;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            background-color: #e3eaf5;
            cursor: pointer;
        }

        button:hover {
            background-color: #c7d8f0;
        }

        .operator {
            background-color: #b7d0f5;
        }

        .equal {
            background-color: #6d9ee8;
            color: white;
        }

        .clear {
            background-color: #f4caca;
        }
    </style>
</head>

<body>

    <div class="calculator">
        <h2>My Calculator</h2>

        <input type="text" id="display" value="0" readonly>

        <div class="buttons">
            <button class="clear" data-action="clear">AC</button>
            <button data-action="delete">⌫</button>
            <button class="operator" data-operator="/">÷</button>
            <button class="operator" data-operator="*">×</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-operator="-">−</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-operator="+">+</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="equal" data-action="calculate">=</button>

            <button data-action="sign">±</button>
            <button data-number="0">0</button>
            <button data-action="decimal">.</button>
            <button class="clear" data-action="clear">C</button>
        </div>
    </div>

    <script>
        const display = document.getElementById("display");

        let firstNumber = null;
        let operator = null;
        let waitingForSecondNumber = false;

        // 숫자 입력
        function inputNumber(number) {
            if (waitingForSecondNumber) {
                display.value = number;
                waitingForSecondNumber = false;
            } else {
                if (display.value === "0") {
                    display.value = number;
                } else {
                    display.value += number;
                }
            }
        }

        // 연산자 선택
        function chooseOperator(nextOperator) {
            if (operator !== null && !waitingForSecondNumber) {
                calculate();
            }

            firstNumber = Number(display.value);
            operator = nextOperator;
            waitingForSecondNumber = true;
        }

        // 계산하기
        function calculate() {
            if (operator === null || waitingForSecondNumber) {
                return;
            }

            const secondNumber = Number(display.value);
            let result;

            if (operator === "+") {
                result = firstNumber + secondNumber;
            } else if (operator === "-") {
                result = firstNumber - secondNumber;
            } else if (operator === "*") {
                result = firstNumber * secondNumber;
            } else if (operator === "/") {
                if (secondNumber === 0) {
                    display.value = "Error";
                    operator = null;
                    firstNumber = null;
                    waitingForSecondNumber = true;
                    return;
                }
                result = firstNumber / secondNumber;
            }

            display.value = String(Number(result.toPrecision(12)));

            firstNumber = null;
            operator = null;
            waitingForSecondNumber = true;
        }

        // 초기화
        function clearDisplay() {
            display.value = "0";
            firstNumber = null;
            operator = null;
            waitingForSecondNumber = false;
        }

        // 마지막 숫자 삭제
        function deleteLast() {
            if (waitingForSecondNumber) return;

            display.value = display.value.slice(0, -1);

            if (display.value === "" || display.value === "-") {
                display.value = "0";
            }
        }

        // 소수점 입력
        function inputDecimal() {
            if (waitingForSecondNumber) {
                display.value = "0.";
                waitingForSecondNumber = false;
            } else if (!display.value.includes(".")) {
                display.value += ".";
            }
        }

        // 양수와 음수 변경
        function changeSign() {
            if (display.value !== "0") {
                display.value = String(-Number(display.value));
            }
        }

        // 버튼 클릭 이벤트
        document.querySelector(".buttons").addEventListener("click", function(event) {
            const button = event.target;

            if (button.dataset.number !== undefined) {
                inputNumber(button.dataset.number);
            }

            if (button.dataset.operator) {
                chooseOperator(button.dataset.operator);
            }

            if (button.dataset.action === "calculate") {
                calculate();
            }

            if (button.dataset.action === "clear") {
                clearDisplay();
            }

            if (button.dataset.action === "delete") {
                deleteLast();
            }

            if (button.dataset.action === "decimal") {
                inputDecimal();
            }

            if (button.dataset.action === "sign") {
                changeSign();
            }
        });
    </script>

</body>
</html>
