
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 계산기</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculator {
            background-color: #333;
            padding: 20px;
            border-radius: 15px;
            width: 260px;
        }

        h2 {
            color: white;
            text-align: center;
        }

        #display {
            width: 100%;
            height: 55px;
            box-sizing: border-box;
            margin-bottom: 15px;
            background-color: white;
            border: none;
            border-radius: 8px;
            text-align: right;
            font-size: 25px;
            padding: 10px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            height: 55px;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            background-color: #eeeeee;
        }

        button:hover {
            background-color: #cccccc;
        }

        .operator {
            background-color: orange;
            color: white;
        }

        .operator:hover {
            background-color: darkorange;
        }

        .clear {
            background-color: #e57373;
            color: white;
        }

        .equal {
            background-color: #66bb6a;
            color: white;
        }
    </style>
</head>

<body>

    <div class="calculator">
        <h2>MY CALCULATOR</h2>

        <input type="text" id="display" value="0" readonly>

        <div class="buttons">
            <button class="clear" id="clear">AC</button>
            <button id="delete">DEL</button>
            <button class="operator" data-operator="/">÷</button>
            <button class="operator" data-operator="*">×</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-operator="-">-</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-operator="+">+</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="equal" id="equal">=</button>

            <button data-number="0">0</button>
            <button id="decimal">.</button>
        </div>
    </div>

    <script>
        // 계산기에 필요한 변수
        let currentInput = "0";
        let previousInput = null;
        let operator = null;
        let shouldResetDisplay = false;

        const display = document.getElementById("display");

        // 화면에 숫자 표시하기
        function updateDisplay() {
            display.value = currentInput;
        }

        // 숫자 입력 함수
        function inputNumber(number) {

            if (shouldResetDisplay) {
                currentInput = number;
                shouldResetDisplay = false;
            }
            else if (currentInput === "0") {
                currentInput = number;
            }
            else {
                currentInput += number;
            }

            updateDisplay();
        }

        // 소수점 입력 함수
        function inputDecimal() {
            if (shouldResetDisplay) {
                currentInput = "0";
                shouldResetDisplay = false;
            }

            if (!currentInput.includes(".")) {
                currentInput += ".";
            }

            updateDisplay();
        }

        // 연산자 선택 함수
        function chooseOperator(nextOperator) {

            if (operator !== null && !shouldResetDisplay) {
                calculate();
            }

            previousInput = currentInput;
            operator = nextOperator;
            shouldResetDisplay = true;
        }

        // 실제 계산을 수행하는 함수
        function calculate() {

            if (operator === null || previousInput === null) {
                return;
            }

            let num1 = Number(previousInput);
            let num2 = Number(currentInput);
            let result;

            if (operator === "+") {
                result = num1 + num2;
            }
            else if (operator === "-") {
                result = num1 - num2;
            }
            else if (operator === "*") {
                result = num1 * num2;
            }
            else if (operator === "/") {

                if (num2 === 0) {
                    currentInput = "0으로 나눌 수 없음";
                    previousInput = null;
                    operator = null;
                    shouldResetDisplay = true;
                    updateDisplay();
                    return;
                }

                result = num1 / num2;
            }

            // 소수점 계산 오차 줄이기
            currentInput = String(Number(result.toFixed(10)));

            previousInput = null;
            operator = null;
            shouldResetDisplay = true;

            updateDisplay();
        }

        // 전체 초기화 함수
        function clearCalculator() {
            currentInput = "0";
            previousInput = null;
            operator = null;
            shouldResetDisplay = false;

            updateDisplay();
        }

        // 마지막 숫자 삭제 함수
        function deleteNumber() {

            if (shouldResetDisplay) {
                return;
            }

            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            }
            else {
                currentInput = "0";
            }

            updateDisplay();
        }

        // 숫자 버튼에 클릭 이벤트 연결
        document.querySelectorAll("[data-number]").forEach(function(button) {
            button.addEventListener("click", function() {
                inputNumber(button.dataset.number);
            });
        });

        // 연산자 버튼에 클릭 이벤트 연결
        document.querySelectorAll("[data-operator]").forEach(function(button) {
            button.addEventListener("click", function() {
                chooseOperator(button.dataset.operator);
            });
        });

        // 나머지 버튼에 클릭 이벤트 연결
        document.getElementById("decimal").addEventListener("click", inputDecimal);
        document.getElementById("equal").addEventListener("click", calculate);
        document.getElementById("clear").addEventListener("click", clearCalculator);
        document.getElementById("delete").addEventListener("click", deleteNumber);

    </script>

</body>
</html>
